services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      GRIDBRICKS_CORS_ORIGINS: ${GRIDBRICKS_CORS_ORIGINS:-http://localhost:8080}
      GRIDBRICKS_USE_FIXTURES: ${GRIDBRICKS_USE_FIXTURES:-false}
      GRIDBRICKS_ELEXON_BASE_URL: ${GRIDBRICKS_ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
